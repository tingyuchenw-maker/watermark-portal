<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>內部安全資料瀏覽系統 (機密防外洩)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col font-sans select-none">

  <!-- ==================== 登入區塊 (Login Modal/Page) ==================== -->
  <div id="login-container" class="flex-1 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8 border border-slate-200">
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-50 text-indigo-600 mb-4 shadow-inner">
          <i class="ph ph-shield-check text-4xl"></i>
        </div>
        <h1 class="text-2xl font-bold text-slate-800">內部機密資料檢視系統</h1>
        <p class="text-sm text-slate-500 mt-1">請登入以存取授權資料，全站啟用動態身分浮水印</p>
      </div>
      <div id="login-alert" class="hidden mb-4 p-3 rounded-lg text-sm bg-rose-50 text-rose-700 border border-rose-200"></div>
      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">員工帳號 / 帳號</label>
          <div class="relative">
            <i class="ph ph-user absolute left-3.5 top-3 text-slate-400 text-lg"></i>
            <input type="text" id="login-username" required placeholder="請輸入帳號 (例如: employee01 或 admin)"
              class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">登入密碼</label>
          <div class="relative">
            <i class="ph ph-lock-key absolute left-3.5 top-3 text-slate-400 text-lg"></i>
            <input type="password" id="login-password" required placeholder="請輸入密碼"
              class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm">
          </div>
        </div>
        <button type="submit" id="btn-login-submit"
          class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-xl shadow-md transition duration-150 flex items-center justify-center gap-2">
          <span>安全登入</span>
          <i class="ph ph-arrow-right font-bold"></i>
        </button>
      </form>

      <div class="mt-6 pt-4 border-t border-slate-100 text-xs text-slate-400 text-center">
        預設測試帳號：<br>
        管理員：<span class="font-mono text-slate-600">admin</span> / <span class="font-mono text-slate-600">admin123</span><br>
        一般員工：<span class="font-mono text-slate-600">employee01</span> / <span class="font-mono text-slate-600">pass123</span>
      </div>
    </div>
  </div>
  
  <!-- ==================== 登入後主畫面 (App Dashboard) ==================== -->
  <div id="app-container" class="hidden flex-1 flex flex-col min-h-screen">
    
    <!-- 頂端導航列 -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-bold shadow">
            <i class="ph ph-table text-xl"></i>
          </div>
          <div>
            <h1 class="text-base font-bold text-slate-800 leading-tight">企業機密資料查詢系統</h1>
            <div class="flex items-center gap-2 text-xs text-emerald-600 font-medium">
              <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
              <span>身分浮水印追蹤保護中</span>
            </div>
          </div>
        </div>

        <!-- 導航功能按鈕與個人資訊 -->
        <div class="flex items-center gap-4">
          <!-- 管理員專用分頁按鈕 -->
          <div id="admin-nav" class="hidden flex items-center gap-1 bg-slate-100 p-1 rounded-xl text-sm">
            <button id="nav-btn-data" class="px-3 py-1.5 rounded-lg font-medium bg-white text-indigo-600 shadow-sm transition">
              <i class="ph ph-table inline mr-1"></i>資料檢視
            </button>
            <button id="nav-btn-admin" class="px-3 py-1.5 rounded-lg font-medium text-slate-600 hover:text-slate-900 transition">
              <i class="ph ph-gear inline mr-1"></i>上傳與後台
            </button>
          </div>

          <!-- 使用者資訊標籤 -->
          <div class="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-xl bg-slate-50 border border-slate-200 text-xs">
            <i class="ph ph-user-circle text-lg text-slate-500"></i>
            <div>
              <span id="user-display-name" class="font-bold text-slate-700">載入中...</span>
              <span id="user-role-badge" class="ml-1 px-1.5 py-0.5 rounded text-[10px] bg-slate-200 text-slate-700 font-semibold uppercase"></span>
            </div>
          </div>

          <!-- 登出按鈕 -->
          <button id="btn-logout" class="text-slate-500 hover:text-rose-600 p-2 rounded-xl hover:bg-slate-100 transition" title="登出">
            <i class="ph ph-sign-out text-xl"></i>
          </button>
        </div>
      </div>
    </header>

    <!-- 主要內容區 -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">

      <!-- ==================== 1. 資料檢視視圖 (Data View) ==================== -->
      <section id="section-data-view" class="space-y-5">
        
        <!-- 大分類切換標籤 (需求 1: 條件與階段、實績表) -->
        <div class="flex flex-wrap items-center justify-between gap-3 bg-white p-3 sm:px-5 rounded-2xl border border-slate-200 shadow-sm">
          <div class="flex items-center gap-2">
            <span class="text-xs font-bold text-slate-400 uppercase tracking-wider mr-1">資料分類：</span>
            <button type="button" onclick="switchCategory('all')" id="tab-cat-all"
              class="px-3.5 py-1.5 rounded-xl text-xs font-bold transition shadow-sm bg-indigo-600 text-white">
              <i class="ph ph-squares-four inline mr-1 text-sm"></i>全部檔案
            </button>
            <button type="button" onclick="switchCategory('條件與階段')" id="tab-cat-conditions"
              class="px-3.5 py-1.5 rounded-xl text-xs font-bold transition bg-slate-50 text-slate-600 hover:bg-emerald-50 hover:text-emerald-700 border border-slate-200">
              <i clas
